name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  MAME4DROID_UPSTREAM_VERSION: "1.37.6"

jobs:
  build:
    name: Assemble debug + release
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Fetch upstream libMAME4droid.so
        working-directory: android-MAME4droid
        run: bash scripts/fetch-mame-lib.sh

      - name: Build debug and release APKs
        working-directory: android-MAME4droid
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          gradle --no-daemon --no-configuration-cache \
            -Pandroid.builder.sdkDownload=true \
            assembleDebug assembleRelease

      - name: Locate APKs
        id: apks
        run: |
          set -e
          DEBUG_APK=$(find android-MAME4droid/app/build/outputs/apk/debug -name '*.apk' | head -n1)
          RELEASE_APK=$(find android-MAME4droid/app/build/outputs/apk/release -name '*.apk' | head -n1)
          echo "debug=$DEBUG_APK" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          ls -lh "$DEBUG_APK" "$RELEASE_APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MAME4droid-Mahjong-debug
          path: ${{ steps.apks.outputs.debug }}
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: MAME4droid-Mahjong-release
          path: ${{ steps.apks.outputs.release }}
          if-no-files-found: error
