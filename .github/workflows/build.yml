name: Build APK

# Manual only — push/PR no longer builds APKs (saves Actions minutes).
on:
  workflow_dispatch:

env:
  MAME4DROID_UPSTREAM_VERSION: "1.37.6"

jobs:
  build:
    name: Assemble full + basic
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Fetch upstream libMAME4droid.so
        working-directory: android-MAME4droid
        run: bash scripts/fetch-mame-lib.sh

      - name: Build full and basic APKs
        working-directory: android-MAME4droid
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          gradle --no-daemon --no-configuration-cache \
            -Pandroid.builder.sdkDownload=true \
            assembleFullDebug assembleFullRelease \
            assembleBasicDebug assembleBasicRelease

      - name: Upload full debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FeiJuchang-full-debug
          path: android-MAME4droid/app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error

      - name: Upload full release APK
        uses: actions/upload-artifact@v4
        with:
          name: FeiJuchang-full-release
          path: android-MAME4droid/app/build/outputs/apk/full/release/*.apk
          if-no-files-found: error

      - name: Upload basic debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FeiJuchang-basic-debug
          path: android-MAME4droid/app/build/outputs/apk/basic/debug/*.apk
          if-no-files-found: error

      - name: Upload basic release APK
        uses: actions/upload-artifact@v4
        with:
          name: FeiJuchang-basic-release
          path: android-MAME4droid/app/build/outputs/apk/basic/release/*.apk
          if-no-files-found: error
